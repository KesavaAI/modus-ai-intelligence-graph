  <rect x="60" y="500" width="510" height="96" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#card-shadow)"/>
  <!-- Official 2D LangChain / LangGraph Logo -->
  <g transform="translate(75, 510)">
    <rect width="32" height="32" rx="6" fill="#1c3d5a"/>
    <circle cx="16" cy="11" r="3" fill="#38bdf8"/>
    <circle cx="10" cy="22" r="3" fill="#38bdf8"/>
    <circle cx="22" cy="22" r="3" fill="#38bdf8"/>
    <line x1="16" y1="11" x2="10" y2="22" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="16" y1="11" x2="22" y2="22" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="10" y1="22" x2="22" y2="22" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="118" y="527" font-size="14" font-weight="bold" fill="#78350f">LangGraph Agentic Extraction Pipeline</text>
  <text x="75" y="550" font-size="11" fill="#475569">• 2-Node State Graph: extract_entities → persist_to_neo4j</text>
  <text x="75" y="566" font-size="11" fill="#475569">• Unstructured SOP Narrative Parsing &amp; Entity Synthesis</text>
  <text x="75" y="582" font-size="11" fill="#475569">• Deterministic NLP Rule-Based Parsing Fallback</text>

  <!-- Component 3.2: LLM Engine (Groq Llama-3.3-70b) -->
  <rect x="610" y="500" width="530" height="96" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#card-shadow)"/>
  <!-- Official 2D Groq / LLM Chip Logo -->
  <g transform="translate(625, 510)">
    <rect width="32" height="32" rx="6" fill="#f97316"/>
    <circle cx="16" cy="16" r="6" fill="#ffffff"/>
    <path d="M16 6 L16 10 M16 22 L16 26 M6 16 L10 16 M22 16 L26 16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="668" y="527" font-size="14" font-weight="bold" fill="#78350f">Groq Cloud LLM Inference (Llama-3.3-70b)</text>
  <text x="625" y="550" font-size="11" fill="#475569">• High-Speed Token Generation (Zero Paid License Tier)</text>
  <text x="625" y="566" font-size="11" fill="#475569">• Structured JSON Schema Enforcement via LangChain Parser</text>
  <text x="625" y="582" font-size="11" fill="#475569">• Feasibility Scores ($0.0 - 1.0) &amp; Reskilling Urgency Mapping</text>

  <!-- ==================== TIER 4: GRAPH STORAGE LAYER ==================== -->
  <rect x="40" y="640" width="1120" height="155" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="640" width="270" height="28" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="52" y="659" font-size="12" font-weight="bold" fill="#065f46">4. GRAPH DATABASE &amp; DUAL STORAGE</text>

  <!-- Component 4.1: Neo4j 5 Community -->
  <rect x="60" y="680" width="510" height="96" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#card-shadow)"/>
  <!-- Official 2D Neo4j Logo -->
  <g transform="translate(75, 690)">
    <rect width="32" height="32" rx="6" fill="#018bff"/>
    <circle cx="11" cy="21" r="3.5" fill="#ffffff"/>
    <circle cx="21" cy="11" r="3.5" fill="#ffffff"/>
    <circle cx="21" cy="21" r="3.5" fill="#002b5c"/>
    <line x1="11" y1="21" x2="21" y2="11" stroke="#ffffff" stroke-width="2"/>
    <line x1="11" y1="21" x2="21" y2="21" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="118" y="707" font-size="14" font-weight="bold" fill="#064e3b">Neo4j 5 Community Edition (bolt://localhost:7687)</text>
  <text x="75" y="730" font-size="11" fill="#475569">• Unique Schema Constraints on :Process, :Activity, :Role, :Skill</text>
  <text x="75" y="746" font-size="11" fill="#475569">• Parameterized Cypher MERGE Operations (Zero Duplicates)</text>
  <text x="75" y="762" font-size="11" fill="#475569">• Relational Edges: CONTAINS_ACTIVITY, EXECUTES, REQUIRES</text>

  <!-- Component 4.2: In-Memory Resilient Mirror -->
  <rect x="610" y="680" width="530" height="96" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#card-shadow)"/>
  <!-- Official 2D NetworkX / Memory Topology Logo -->
  <g transform="translate(625, 690)">
    <rect width="32" height="32" rx="6" fill="#059669"/>
    <circle cx="10" cy="12" r="2.5" fill="#ffffff"/>
    <circle cx="22" cy="12" r="2.5" fill="#ffffff"/>
    <circle cx="16" cy="22" r="2.5" fill="#ffffff"/>
    <circle cx="16" cy="12" r="1.5" fill="#a7f3d0"/>
    <line x1="10" y1="12" x2="22" y2="12" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="10" y1="12" x2="16" y2="22" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="22" y1="12" x2="16" y2="22" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <text x="668" y="707" font-size="14" font-weight="bold" fill="#064e3b">Resilient In-Memory Graph Engine (NetworkX)</text>
  <text x="625" y="730" font-size="11" fill="#475569">• 0.5s Fast Socket Probe with Zero-Downtime Auto-Failover</text>
  <text x="625" y="746" font-size="11" fill="#475569">• 25 Seeded Enterprise Workflows (225+ Nodes, 275+ Edges)</text>
  <text x="625" y="762" font-size="11" fill="#475569">• Standalone Multi-Hop Traversal API for Edge CDN &amp; Local Modes</text>

  <!-- ==================== CONNECTING DATA FLOW ARROWS ==================== -->
  <line x1="225" y1="242" x2="225" y2="325" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="975" y1="242" x2="975" y2="325" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  
  <line x1="315" y1="417" x2="315" y2="500" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="875" y1="417" x2="875" y2="500" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  
  <line x1="315" y1="596" x2="315" y2="680" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <line x1="875" y1="596" x2="875" y2="680" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>

</svg>

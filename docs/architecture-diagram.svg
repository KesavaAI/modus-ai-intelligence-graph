<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Background -->
  <rect width="1200" height="860" fill="#ffffff"/>
  
  <!-- Header / Title Banner -->
  <rect x="0" y="0" width="1200" height="80" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Enterprise Graph Logo -->
  <g transform="translate(40, 18)">
    <rect width="44" height="44" rx="10" fill="#2563eb"/>
    <circle cx="14" cy="22" r="4" fill="#ffffff"/>
    <circle cx="30" cy="14" r="3.5" fill="#60a5fa"/>
    <circle cx="30" cy="30" r="3.5" fill="#a7f3d0"/>
    <line x1="14" y1="22" x2="30" y2="14" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="14" y1="22" x2="30" y2="30" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <text x="96" y="44" font-size="20" font-weight="bold" fill="#0f172a">Enterprise AI Intelligence Graph — Full-Stack Technical Architecture</text>
  <text x="96" y="63" font-size="12" fill="#64748b">Process × Role × Skill Cascading Impact Ontology &amp; Multi-Hop Analysis Engine</text>
  
  <!-- DEFINE ARROW MARKERS & FILTERS -->
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ==================== TIER 1: FRONTEND PRESENTATION LAYER ==================== -->
  <rect x="40" y="100" width="1120" height="160" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="100" width="260" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="119" font-size="12" font-weight="bold" fill="#1e40af">1. FRONTEND PRESENTATION LAYER</text>

  <!-- Component 1.1: Next.js Web App -->
  <rect x="60" y="140" width="335" height="102" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#card-shadow)"/>
  <!-- Official 2D Next.js Logo -->
  <g transform="translate(75, 150)">
    <circle cx="16" cy="16" r="16" fill="#000000"/>
    <path d="M12 9 L12 23 M12 9 L23 23 M20 9 L20 17" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="118" y="166" font-size="14" font-weight="bold" fill="#1e3a8a">Next.js 14 App Router</text>
  <text x="75" y="192" font-size="11" fill="#475569">• TypeScript 7.0 &amp; React 18 Core</text>
  <text x="75" y="208" font-size="11" fill="#475569">• KPI Metrics Ribbon &amp; Domain Filtering</text>
  <text x="75" y="224" font-size="11" fill="#475569">• Vercel Global Edge CDN Distribution</text>

  <!-- Component 1.2: React Flow Canvas -->
  <rect x="425" y="140" width="350" height="102" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#card-shadow)"/>
  <!-- Official 2D React Flow Logo -->
  <g transform="translate(440, 150)">
    <rect width="32" height="32" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="10" cy="10" r="3" fill="#0284c7"/>
    <circle cx="22" cy="10" r="3" fill="#0284c7"/>
    <circle cx="16" cy="22" r="3" fill="#10b981"/>
    <line x1="10" y1="10" x2="16" y2="22" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="22" y1="10" x2="16" y2="22" stroke="#0284c7" stroke-width="1.5"/>
  </g>
  <text x="484" y="166" font-size="14" font-weight="bold" fill="#1e3a8a">React Flow (@xyflow/react)</text>
  <text x="440" y="192" font-size="11" fill="#475569">• Dynamic Hierarchical Multi-Tier Graph Canvas</text>
  <text x="440" y="208" font-size="11" fill="#475569">• Color-Coded Entity Nodes (Process, Step, Role, Skill)</text>
  <text x="440" y="224" font-size="11" fill="#475569">• Smoothstep Animated Edges &amp; MiniMap Navigation</text>

  <!-- Component 1.3: Ingestion & Cascade Drawers -->
  <rect x="805" y="140" width="335" height="102" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#card-shadow)"/>
  <!-- 2D Workflow Modal / Drawer Icon -->
  <g transform="translate(820, 150)">
    <rect width="32" height="32" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="6" y="8" width="20" height="4" rx="2" fill="#3b82f6"/>
    <rect x="6" y="15" width="14" height="3" rx="1.5" fill="#93c5fd"/>
    <rect x="6" y="21" width="18" height="3" rx="1.5" fill="#93c5fd"/>
  </g>
  <text x="864" y="166" font-size="14" font-weight="bold" fill="#1e3a8a">Live Ingestion &amp; Cascade Panel</text>
  <text x="820" y="192" font-size="11" fill="#475569">• Live "Surprise Challenge" Ingestion Modal</text>
  <text x="820" y="208" font-size="11" fill="#475569">• 4-Step Real-Time Execution Animation</text>
  <text x="820" y="224" font-size="11" fill="#475569">• Multi-Hop Disruption &amp; Reskilling Side-Drawer</text>

  <!-- ==================== TIER 2: API BACKEND LAYER ==================== -->
  <rect x="40" y="285" width="1120" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="285" width="240" height="28" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="52" y="304" font-size="12" font-weight="bold" fill="#5b21b6">2. BACKEND REST API LAYER</text>

  <!-- Component 2.1: FastAPI Endpoints -->
  <rect x="60" y="325" width="510" height="92" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#card-shadow)"/>
  <!-- Official 2D FastAPI Logo -->
  <g transform="translate(75, 335)">
    <circle cx="16" cy="16" r="16" fill="#009688"/>
    <path d="M17 6 L10 18 L16 18 L15 26 L23 14 L17 14 Z" fill="#ffffff"/>
  </g>
  <text x="118" y="352" font-size="14" font-weight="bold" fill="#4c1d95">FastAPI Application Server (Python 3.11+)</text>
  <text x="75" y="375" font-size="11" fill="#475569">• POST /api/v1/process/ingest (Ingest Raw Narrative Documents)</text>
  <text x="75" y="391" font-size="11" fill="#475569">• POST /api/v1/intelligence/cascade (Downstream Disruption Traversal)</text>
  <text x="75" y="407" font-size="11" fill="#475569">• GET /api/v1/graph/all &amp; GET /api/v1/health (Graph Query Endpoints)</text>

  <!-- Component 2.2: Pydantic v2 Models -->
  <rect x="610" y="325" width="530" height="92" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#card-shadow)"/>
  <!-- Official 2D Pydantic Logo -->
  <g transform="translate(625, 335)">
    <rect width="32" height="32" rx="6" fill="#e11d48"/>
    <path d="M10 10 L22 10 C25 10 25 18 22 18 L10 18 Z M10 18 L10 24" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <text x="668" y="352" font-size="14" font-weight="bold" fill="#4c1d95">Pydantic v2 Data Validation Schemas</text>
  <text x="625" y="375" font-size="11" fill="#475569">• ProcessExtraction, ActivityImpact, RoleImpact, SkillImpact</text>
  <text x="625" y="391" font-size="11" fill="#475569">• Financial Exposure Formula: Headcount × Avg Salary × Feasibility</text>
  <text x="625" y="407" font-size="11" fill="#475569">• Interactive OpenAPI 3.0 Documentation at /docs</text>


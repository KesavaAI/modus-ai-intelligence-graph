<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Background -->
  <rect width="1200" height="800" fill="#ffffff"/>
  
  <!-- Header / Title -->
  <rect x="0" y="0" width="1200" height="70" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#0f172a">Enterprise AI Intelligence Graph — System Architecture</text>
  <text x="40" y="60" font-size="12" fill="#64748b">Process × Role × Skill Cascading Impact Ontology &amp; Multi-Hop Analysis Engine</text>
  
  <!-- DEFINE ARROW MARKERS -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ==================== TIER 1: FRONTEND LAYER ==================== -->
  <rect x="40" y="95" width="1120" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="95" width="220" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="114" font-size="12" font-weight="bold" fill="#1e40af">1. FRONTEND PRESENTATION LAYER</text>

  <!-- Component 1.1: Next.js Dashboard -->
  <rect x="60" y="135" width="330" height="90" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="75" y="160" font-size="14" font-weight="bold" fill="#1e3a8a">Next.js 14 Web Dashboard</text>
  <text x="75" y="180" font-size="11" fill="#475569">• App Router &amp; Dynamic State Management</text>
  <text x="75" y="196" font-size="11" fill="#475569">• KPI Summary Ribbon &amp; Domain Filters</text>
  <text x="75" y="212" font-size="11" fill="#475569">• Vercel Global Edge CDN Hosting</text>

  <!-- Component 1.2: React Flow Canvas -->
  <rect x="430" y="135" width="340" height="90" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="445" y="160" font-size="14" font-weight="bold" fill="#1e3a8a">Interactive Graph Canvas</text>
  <text x="445" y="180" font-size="11" fill="#475569">• React Flow (@xyflow/react) Node Engine</text>
  <text x="445" y="196" font-size="11" fill="#475569">• Color-Coded Entities (Process, Step, Role, Skill)</text>
  <text x="445" y="212" font-size="11" fill="#475569">• Dynamic Tier Layout &amp; Zoom Controls</text>

  <!-- Component 1.3: Ingestion & Analytics Drawers -->
  <rect x="810" y="135" width="330" height="90" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="825" y="160" font-size="14" font-weight="bold" fill="#1e3a8a">Surprise Ingestion &amp; Cascade Panel</text>
  <text x="825" y="180" font-size="11" fill="#475569">• Live Ingestion Modal with 4-Step Tracker</text>
  <text x="825" y="196" font-size="11" fill="#475569">• Multi-Hop Disruption Score Gauges</text>
  <text x="825" y="212" font-size="11" fill="#475569">• Reskilling Roadmaps &amp; Salary Pool at Risk</text>

  <!-- ==================== TIER 2: API BACKEND LAYER ==================== -->
  <rect x="40" y="270" width="1120" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="270" width="200" height="28" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="52" y="289" font-size="12" font-weight="bold" fill="#5b21b6">2. BACKEND REST API LAYER</text>

  <!-- Component 2.1: FastAPI Endpoints -->
  <rect x="60" y="308" width="510" height="85" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="75" y="330" font-size="14" font-weight="bold" fill="#4c1d95">FastAPI Application Service (Python 3.11+)</text>
  <text x="75" y="350" font-size="11" fill="#475569">• POST /api/v1/process/ingest (Dynamic Entity Extraction)</text>
  <text x="75" y="366" font-size="11" fill="#475569">• POST /api/v1/intelligence/cascade (Cascading Disruption Traversal)</text>
  <text x="75" y="382" font-size="11" fill="#475569">• GET /api/v1/graph/all &amp; GET /api/v1/health (Graph Query Endpoints)</text>

  <!-- Component 2.2: Pydantic v2 Models -->
  <rect x="610" y="308" width="530" height="85" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="625" y="330" font-size="14" font-weight="bold" fill="#4c1d95">Pydantic v2 Validation &amp; Schema Layer</text>
  <text x="625" y="350" font-size="11" fill="#475569">• ProcessExtraction, ActivityImpact, RoleImpact, SkillImpact</text>
  <text x="625" y="366" font-size="11" fill="#475569">• Financial Exposure Formula: Headcount × Avg Salary × Feasibility</text>
  <text x="625" y="382" font-size="11" fill="#475569">• OpenAPI 3.0 Auto-Generated Interactive Swagger Docs (/docs)</text>

  <!-- ==================== TIER 3: AI ORCHESTRATION LAYER ==================== -->
  <rect x="40" y="435" width="1120" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="435" width="220" height="28" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="52" y="454" font-size="12" font-weight="bold" fill="#92400e">3. AI EXTRACTION &amp; ORCHESTRATION</text>

  <!-- Component 3.1: LangGraph Pipeline -->
  <rect x="60" y="475" width="510" height="92" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="75" y="498" font-size="14" font-weight="bold" fill="#78350f">LangGraph Ingestion Pipeline</text>
  <text x="75" y="518" font-size="11" fill="#475569">• 2-Node State Graph: extract_entities → persist_to_neo4j</text>
  <text x="75" y="534" font-size="11" fill="#475569">• Unstructured SOP Narrative Parsing &amp; Entity Synthesis</text>
  <text x="75" y="550" font-size="11" fill="#475569">• Fallback NLP Rule Parser for Deterministic Verification</text>

  <!-- Component 3.2: LLM Engine -->
  <rect x="610" y="475" width="530" height="92" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="625" y="498" font-size="14" font-weight="bold" fill="#78350f">LLM Inference &amp; Structured Output</text>
  <text x="625" y="518" font-size="11" fill="#475569">• Groq Cloud API: Llama-3.3-70b-versatile (Free Tier)</text>
  <text x="625" y="534" font-size="11" fill="#475569">• Structured JSON Mode via LangChain Pydantic Output Parser</text>
  <text x="625" y="550" font-size="11" fill="#475569">• Activity Feasibility ($0.0 - 1.0) &amp; Reskilling Urgency Classification</text>

  <!-- ==================== TIER 4: GRAPH STORAGE LAYER ==================== -->
  <rect x="40" y="610" width="1120" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="610" width="220" height="28" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="52" y="629" font-size="12" font-weight="bold" fill="#065f46">4. GRAPH DATABASE &amp; DUAL STORAGE</text>

  <!-- Component 4.1: Neo4j 5 Community -->
  <rect x="60" y="650" width="510" height="92" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="75" y="673" font-size="14" font-weight="bold" fill="#064e3b">Neo4j 5 Community Edition (bolt://localhost:7687)</text>
  <text x="75" y="693" font-size="11" fill="#475569">• Unique Constraints &amp; Schema Indexing on :Process, :Activity, :Role, :Skill</text>
  <text x="75" y="709" font-size="11" fill="#475569">• Parameterized Cypher MERGE Operations (Idempotent Ingestion)</text>
  <text x="75" y="725" font-size="11" fill="#475569">• Multi-Hop Relationship Edges: CONTAINS_ACTIVITY, EXECUTES, REQUIRES</text>

  <!-- Component 4.2: In-Memory Resilient Mirror -->
  <rect x="610" y="650" width="530" height="92" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="625" y="673" font-size="14" font-weight="bold" fill="#064e3b">Resilient In-Memory Graph Engine (NetworkX)</text>
  <text x="625" y="693" font-size="11" fill="#475569">• 0.5s Fast Socket Probe with Zero-Downtime Auto-Failover</text>
  <text x="625" y="709" font-size="11" fill="#475569">• 25 Pre-Seeded Enterprise Workflows (225+ Nodes, 275+ Edges)</text>
  <text x="625" y="725" font-size="11" fill="#475569">• Identical Cascading Traversal API for Local &amp; Serverless Deployments</text>

  <!-- DATA FLOW CONNECTING ARROWS -->
  <!-- Downward Arrows -->
  <line x1="220" y1="225" x2="220" y2="308" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="970" y1="225" x2="970" y2="308" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  
  <line x1="315" y1="393" x2="315" y2="475" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="315" y1="567" x2="315" y2="650" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="875" y1="393" x2="875" y2="475" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="875" y1="567" x2="875" y2="650" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

</svg>

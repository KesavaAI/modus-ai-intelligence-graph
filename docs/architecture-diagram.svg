  <rect x="40" y="460" width="1120" height="155" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="460" width="270" height="28" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>

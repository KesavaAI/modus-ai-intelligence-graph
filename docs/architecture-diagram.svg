<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Background -->
  <rect width="1200" height="820" fill="#ffffff"/>
  
  <!-- Header / Title Banner -->
  <rect x="0" y="0" width="1200" height="75" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Title Icon -->
  <g transform="translate(40, 20)">
    <rect width="36" height="36" rx="8" fill="#2563eb"/>
    <path d="M10 18 L15 12 L21 24 L26 18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="10" cy="18" r="2" fill="#ffffff"/>
    <circle cx="15" cy="12" r="2" fill="#ffffff"/>
    <circle cx="21" cy="24" r="2" fill="#ffffff"/>
    <circle cx="26" cy="18" r="2" fill="#ffffff"/>
  </g>
  <text x="88" y="42" font-size="20" font-weight="bold" fill="#0f172a">Enterprise AI Intelligence Graph — Full-Stack Architecture</text>
  <text x="88" y="60" font-size="12" fill="#64748b">Process × Role × Skill Cascading Impact Ontology &amp; Multi-Hop Analysis Engine</text>
  
  <!-- DEFINE ARROW MARKERS -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ==================== TIER 1: FRONTEND LAYER ==================== -->
  <rect x="40" y="95" width="1120" height="155" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="95" width="240" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="114" font-size="12" font-weight="bold" fill="#1e40af">🖥️ 1. FRONTEND PRESENTATION LAYER</text>

  <!-- Component 1.1: Next.js Dashboard -->
  <rect x="60" y="135" width="330" height="96" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Next.js Icon -->
  <circle cx="82" cy="157" r="12" fill="#000000"/>
  <text x="77" y="162" font-size="12" font-weight="bold" fill="#ffffff">N</text>
  <text x="102" y="162" font-size="14" font-weight="bold" fill="#1e3a8a">Next.js 14 Dashboard</text>
  <text x="75" y="184" font-size="11" fill="#475569">• App Router &amp; Dynamic State Management</text>
  <text x="75" y="200" font-size="11" fill="#475569">• KPI Summary Ribbon &amp; Domain Filters</text>
  <text x="75" y="216" font-size="11" fill="#475569">• Vercel Global Edge CDN Hosting</text>

  <!-- Component 1.2: React Flow Canvas -->
  <rect x="430" y="135" width="340" height="96" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- React Flow Graph Icon -->
  <rect x="445" y="145" width="24" height="24" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="452" cy="152" r="2.5" fill="#3b82f6"/>
  <circle cx="462" cy="162" r="2.5" fill="#10b981"/>
  <line x1="452" y1="152" x2="462" y2="162" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="478" y="162" font-size="14" font-weight="bold" fill="#1e3a8a">Interactive Graph Canvas</text>
  <text x="445" y="184" font-size="11" fill="#475569">• React Flow (@xyflow/react) Node Engine</text>
  <text x="445" y="200" font-size="11" fill="#475569">• Color-Coded Entities (Process, Step, Role, Skill)</text>
  <text x="445" y="216" font-size="11" fill="#475569">• Dynamic Tier Layout &amp; Zoom Controls</text>

  <!-- Component 1.3: Ingestion & Analytics Drawers -->
  <rect x="810" y="135" width="330" height="96" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Drawer Icon -->
  <rect x="825" y="145" width="24" height="24" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <path d="M830 153 L844 153 M830 157 L840 157 M830 161 L837 161" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <text x="858" y="162" font-size="14" font-weight="bold" fill="#1e3a8a">Surprise Ingest &amp; Cascade</text>
  <text x="825" y="184" font-size="11" fill="#475569">• Live Ingestion Modal with 4-Step Tracker</text>
  <text x="825" y="200" font-size="11" fill="#475569">• Multi-Hop Disruption Score Gauges</text>
  <text x="825" y="216" font-size="11" fill="#475569">• Reskilling Roadmaps &amp; Salary Pool at Risk</text>

  <!-- ==================== TIER 2: API BACKEND LAYER ==================== -->
  <rect x="40" y="275" width="1120" height="145" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="275" width="220" height="28" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="52" y="294" font-size="12" font-weight="bold" fill="#5b21b6">⚙️ 2. BACKEND REST API LAYER</text>

  <!-- Component 2.1: FastAPI Endpoints -->
  <rect x="60" y="315" width="510" height="90" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- FastAPI Bolt Icon -->
  <rect x="75" y="325" width="24" height="24" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <path d="M88 327 L82 338 L88 338 L84 347 L94 335 L88 335 Z" fill="#8b5cf6"/>
  <text x="108" y="342" font-size="14" font-weight="bold" fill="#4c1d95">FastAPI Application Service (Python 3.11+)</text>
  <text x="75" y="364" font-size="11" fill="#475569">• POST /api/v1/process/ingest (Dynamic Entity Extraction)</text>
  <text x="75" y="380" font-size="11" fill="#475569">• POST /api/v1/intelligence/cascade (Cascading Disruption Traversal)</text>
  <text x="75" y="396" font-size="11" fill="#475569">• GET /api/v1/graph/all &amp; GET /api/v1/health (Graph Query Endpoints)</text>

  <!-- Component 2.2: Pydantic v2 Models -->
  <rect x="610" y="315" width="530" height="90" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Pydantic Shield / Schema Icon -->
  <rect x="625" y="325" width="24" height="24" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <path d="M637 328 L645 332 L645 340 C645 344 637 347 637 347 C637 347 629 344 629 340 L629 332 Z" fill="#8b5cf6"/>
  <text x="658" y="342" font-size="14" font-weight="bold" fill="#4c1d95">Pydantic v2 Validation &amp; Schemas</text>
  <text x="625" y="364" font-size="11" fill="#475569">• ProcessExtraction, ActivityImpact, RoleImpact, SkillImpact</text>
  <text x="625" y="380" font-size="11" fill="#475569">• Financial Exposure Formula: Headcount × Avg Salary × Feasibility</text>
  <text x="625" y="396" font-size="11" fill="#475569">• OpenAPI 3.0 Auto-Generated Interactive Swagger Docs (/docs)</text>

  <!-- ==================== TIER 3: AI ORCHESTRATION LAYER ==================== -->
  <rect x="40" y="445" width="1120" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="445" width="250" height="28" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="52" y="464" font-size="12" font-weight="bold" fill="#92400e">🤖 3. AI EXTRACTION &amp; ORCHESTRATION</text>

  <!-- Component 3.1: LangGraph Pipeline -->
  <rect x="60" y="485" width="510" height="94" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- LangGraph Workflow Icon -->
  <rect x="75" y="495" width="24" height="24" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="81" cy="507" r="3" fill="#f59e0b"/>
  <circle cx="93" cy="502" r="3" fill="#f59e0b"/>
  <circle cx="93" cy="512" r="3" fill="#f59e0b"/>
  <line x1="81" y1="507" x2="93" y2="502" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="81" y1="507" x2="93" y2="512" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="108" y="512" font-size="14" font-weight="bold" fill="#78350f">LangGraph Ingestion Pipeline</text>
  <text x="75" y="534" font-size="11" fill="#475569">• 2-Node State Graph: extract_entities → persist_to_neo4j</text>
  <text x="75" y="550" font-size="11" fill="#475569">• Unstructured SOP Narrative Parsing &amp; Entity Synthesis</text>
  <text x="75" y="566" font-size="11" fill="#475569">• Fallback NLP Rule Parser for Deterministic Verification</text>

  <!-- Component 3.2: LLM Engine -->
  <rect x="610" y="485" width="530" height="94" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Groq/Brain Icon -->
  <rect x="625" y="495" width="24" height="24" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="637" cy="507" r="6" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
  <path d="M634 507 C634 504 640 504 640 507 C640 510 634 510 634 507" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
  <text x="658" y="512" font-size="14" font-weight="bold" fill="#78350f">LLM Inference &amp; Structured Output</text>
  <text x="625" y="534" font-size="11" fill="#475569">• Groq Cloud API: Llama-3.3-70b-versatile (Free Tier)</text>
  <text x="625" y="550" font-size="11" fill="#475569">• Structured JSON Mode via LangChain Pydantic Output Parser</text>
  <text x="625" y="566" font-size="11" fill="#475569">• Activity Feasibility ($0.0 - 1.0) &amp; Reskilling Urgency Classification</text>

  <!-- ==================== TIER 4: GRAPH STORAGE LAYER ==================== -->
  <rect x="40" y="620" width="1120" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="620" width="250" height="28" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="52" y="639" font-size="12" font-weight="bold" fill="#065f46">🗄️ 4. GRAPH DATABASE &amp; DUAL STORAGE</text>

  <!-- Component 4.1: Neo4j 5 Community -->
  <rect x="60" y="660" width="510" height="94" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Neo4j Graph DB Icon -->
  <rect x="75" y="670" width="24" height="24" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="87" cy="682" r="7" fill="#10b981"/>
  <circle cx="87" cy="682" r="3" fill="#ffffff"/>
  <text x="108" y="687" font-size="14" font-weight="bold" fill="#064e3b">Neo4j 5 Community Edition (bolt://localhost:7687)</text>
  <text x="75" y="709" font-size="11" fill="#475569">• Unique Constraints &amp; Schema Indexing on :Process, :Activity, :Role, :Skill</text>
  <text x="75" y="725" font-size="11" fill="#475569">• Parameterized Cypher MERGE Operations (Idempotent Ingestion)</text>
  <text x="75" y="741" font-size="11" fill="#475569">• Multi-Hop Relationship Edges: CONTAINS_ACTIVITY, EXECUTES, REQUIRES</text>

  <!-- Component 4.2: In-Memory Resilient Mirror -->
  <rect x="610" y="660" width="530" height="94" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Memory / Chip Icon -->
  <rect x="625" y="670" width="24" height="24" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="630" y="675" width="14" height="14" rx="2" stroke="#10b981" stroke-width="1.5" fill="none"/>
  <circle cx="637" cy="682" r="2" fill="#10b981"/>
  <text x="658" y="687" font-size="14" font-weight="bold" fill="#064e3b">Resilient In-Memory Graph Engine (NetworkX)</text>
  <text x="625" y="709" font-size="11" fill="#475569">• 0.5s Fast Socket Probe with Zero-Downtime Auto-Failover</text>
  <text x="625" y="725" font-size="11" fill="#475569">• 25 Pre-Seeded Enterprise Workflows (225+ Nodes, 275+ Edges)</text>
  <text x="625" y="741" font-size="11" fill="#475569">• Identical Cascading Traversal API for Local &amp; Serverless Deployments</text>

  <!-- DATA FLOW CONNECTING ARROWS -->
  <line x1="225" y1="231" x2="225" y2="315" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="975" y1="231" x2="975" y2="315" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  
  <line x1="315" y1="405" x2="315" y2="485" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="875" y1="405" x2="875" y2="485" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  
  <line x1="315" y1="579" x2="315" y2="660" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="875" y1="579" x2="875" y2="660" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
